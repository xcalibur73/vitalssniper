<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixture: Cumulative Layout Shift Session Window</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 24px; }
    #shift-box { background: #fee2e2; border: 2px dashed #ef4444; padding: 12px; margin-bottom: 8px; }
    #shifted-content { background: #f0fdf4; padding: 24px; border: 1px solid #86efac; }
  </style>
</head>
<body>
  <h1>Layout Shift Dynamics</h1>
  <div id="insertion-point"></div>
  <div id="shifted-content">
    <h2>Stable Content Block Under Observation</h2>
    <p>This paragraph is displaced when dynamic banners are injected above it without reserved dimensional space.</p>
  </div>
  <script>
    // Trigger layout shift shortly after initial paint
    setTimeout(() => {
      const banner = document.createElement('div');
      banner.id = 'shift-box';
      banner.style.height = '120px';
      banner.textContent = 'Dynamic Unreserved Promotional Banner (Induces CLS)';
      document.getElementById('insertion-point').appendChild(banner);
    }, 50);
  </script>
</body>
</html>
