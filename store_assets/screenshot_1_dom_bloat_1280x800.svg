      <text x="51" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">Overview</text>
      
      <!-- Inactive Tabs -->
      <text x="151" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Forensics</text>
      <text x="252" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">SEO Tree</text>
      <text x="353" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Pitch</text>
    </g>

    <!-- Health Score & Target Summary Card -->
    <g transform="translate(18, 98)">
      <rect width="404" height="78" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <!-- Health Dial -->
      <circle cx="48" cy="39" r="28" fill="none" stroke="#efefef" stroke-width="5"/>
      <circle cx="48" cy="39" r="28" fill="none" stroke="#f59e0b" stroke-width="5" stroke-dasharray="176" stroke-dashoffset="38"/>
      <text x="48" y="44" class="font-sans" font-size="18" font-weight="900" fill="#1a1a1a" text-anchor="middle">78</text>

      <text x="92" y="28" class="font-sans" font-size="13" font-weight="800" fill="#1a1a1a">Apex Design Co. - Storefront</text>
      <text x="92" y="46" class="font-sans" font-size="10.5" fill="#5e5e5e">DOM: 1,842 nodes | Depth: 24 levels | Wire: 1.42 MB</text>
      <rect x="92" y="54" width="76" height="16" rx="3" fill="#fef3c7"/>
      <text x="130" y="65.5" class="font-sans" font-size="8.5" font-weight="700" fill="#d97706" text-anchor="middle">NEEDS WORK</text>
    </g>

    <!-- Revenue Loss Card -->
    <g transform="translate(18, 184)">
      <rect width="404" height="74" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="74" rx="2" fill="#e63946"/>
      <text x="16" y="22" class="font-sans" font-size="11" font-weight="700" fill="#e63946">ESTIMATED REVENUE LEAKAGE</text>
      <text x="16" y="44" class="font-mono" font-size="20" font-weight="900" fill="#1a1a1a">-$3,420 / mo</text>
      <text x="156" y="42" class="font-sans" font-size="10.5" fill="#5e5e5e">(-8.9% conversion drag)</text>
      <text x="16" y="62" class="font-sans" font-size="10" fill="#666666">Latency decay curve based on 3.42s LCP and 0.14 CLS.</text>
    </g>

    <!-- Stack Detection Pills -->
    <g transform="translate(18, 266)">
      <rect width="404" height="78" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="14" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a">Detected Tech Stack (60+ Signatures)</text>
      
      <!-- Pills -->
      <g transform="translate(14, 30)">
        <!-- Shopify -->
        <rect x="0" y="0" width="68" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="34" y="14.5" class="font-sans" font-size="9.5" font-weight="700" fill="#065f46" text-anchor="middle">Shopify</text>

        <!-- Next.js -->
        <rect x="74" y="0" width="66" height="22" rx="4" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
        <text x="107" y="14.5" class="font-sans" font-size="9.5" font-weight="700" fill="#1f2937" text-anchor="middle">Next.js</text>

        <!-- Klaviyo -->
        <rect x="146" y="0" width="66" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="179" y="14.5" class="font-sans" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="middle">Klaviyo</text>

        <!-- Meta Pixel -->
        <rect x="218" y="0" width="76" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="256" y="14.5" class="font-sans" font-size="9.5" font-weight="700" fill="#1e40af" text-anchor="middle">Meta Pixel</text>

        <!-- Cloudflare -->
        <rect x="300" y="0" width="74" height="22" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
        <text x="337" y="14.5" class="font-sans" font-size="9.5" font-weight="700" fill="#9a3412" text-anchor="middle">Cloudflare</text>
      </g>
    </g>

    <!-- Core Web Vitals 3-Card Grid -->
    <g transform="translate(18, 352)">
      <text x="2" y="14" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a">Core Web Vitals Telemetry</text>

      <g transform="translate(0, 22)">
        <!-- LCP Card -->
        <g transform="translate(0, 0)">
          <rect width="128" height="90" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
          <text x="12" y="20" class="font-sans" font-size="10.5" font-weight="700" fill="#5e5e5e">LCP</text>
          <text x="12" y="44" class="font-mono" font-size="20" font-weight="900" fill="#d97706">3.42s</text>
          <rect x="12" y="56" width="68" height="18" rx="4" fill="#fef3c7"/>
          <text x="46" y="68.5" class="font-sans" font-size="8.5" font-weight="800" fill="#d97706" text-anchor="middle">NEEDS WORK</text>
        </g>

        <!-- INP Card -->
        <g transform="translate(138, 0)">
          <rect width="128" height="90" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
          <text x="12" y="20" class="font-sans" font-size="10.5" font-weight="700" fill="#5e5e5e">INP</text>
          <text x="12" y="44" class="font-mono" font-size="20" font-weight="900" fill="#10b981">185ms</text>
          <rect x="12" y="56" width="50" height="18" rx="4" fill="#ecfdf5"/>
          <text x="37" y="68.5" class="font-sans" font-size="8.5" font-weight="800" fill="#059669" text-anchor="middle">GOOD</text>
        </g>

        <!-- CLS Card -->
        <g transform="translate(276, 0)">
          <rect width="128" height="90" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
          <text x="12" y="20" class="font-sans" font-size="10.5" font-weight="700" fill="#5e5e5e">CLS</text>
          <text x="12" y="44" class="font-mono" font-size="20" font-weight="900" fill="#d97706">0.14</text>
          <rect x="12" y="56" width="68" height="18" rx="4" fill="#fef3c7"/>
          <text x="46" y="68.5" class="font-sans" font-size="8.5" font-weight="800" fill="#d97706" text-anchor="middle">NEEDS WORK</text>
        </g>
      </g>
    </g>

    <!-- Action Bar & Footer -->
    <g transform="translate(18, 480)">
      <rect width="404" height="42" rx="6" fill="#1a1a1a"/>
      <text x="202" y="26" class="font-sans" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Run Deep Forensics Audit (Tab 2)</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(18, 592)">
      <text x="0" y="14" class="font-sans" font-size="10" font-weight="600" fill="#888888">v1.6.1 PRO : WebAudits.pro Quiet Paper Interface</text>
      <text x="404" y="14" class="font-sans" font-size="10" font-weight="700" fill="#e63946" text-anchor="end">webaudits.pro</text>
    </g>
  </g>
</svg>