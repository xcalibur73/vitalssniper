<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <filter id="browserShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1a1a1a" flood-opacity="0.14"/>
    </filter>

    <filter id="popupShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1a1a1a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>

    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e3e3e3" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>

  <!-- Outer Canvas Base -->
  <rect width="1280" height="800" fill="url(#bgGrad1)"/>
  <rect width="1280" height="800" fill="url(#dotGrid)"/>

  <!-- ======================================================================
       SIMULATED BACKGROUND BROWSER (1180px x 728px) at (50, 36)
       ====================================================================== -->
  <g transform="translate(50, 36)" filter="url(#browserShadow)">
    <rect width="1180" height="728" rx="10" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>

    <!-- Browser Chrome Bar -->
    <rect width="1180" height="42" rx="10" fill="#1a1a1a"/>
    <rect y="32" width="1180" height="10" fill="#1a1a1a"/>

    <!-- Window Controls -->
    <circle cx="22" cy="21" r="5" fill="#E63946"/>
    <circle cx="38" cy="21" r="5" fill="#E5A93C"/>
    <circle cx="54" cy="21" r="5" fill="#43A047"/>

    <!-- Browser URL Bar -->
    <rect x="90" y="8" width="560" height="26" rx="5" fill="#2d2d2d"/>
    <circle cx="104" cy="21" r="3.5" fill="#43A047"/>
    <text x="116" y="25" class="font-sans" font-size="11" fill="#e3e3e3">https://apex-store-demo.com/products/artisan-chair</text>

    <!-- Simulated Target Site Background -->
    <g transform="translate(0, 42)" opacity="0.45">
      <rect width="1180" height="56" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="80" y="36" class="font-sans" font-size="16" font-weight="900" fill="#1a1a1a">APEX DESIGN CO.</text>
      <text x="760" y="35" class="font-sans" font-size="12" fill="#5e5e5e">Furniture   |   Lighting   |   Studio   |   Cart (2)</text>

      <rect y="56" width="1180" height="630" fill="#fafafa"/>
      <rect x="80" y="90" width="460" height="320" rx="8" fill="#e3e3e3" opacity="0.5"/>
      <rect x="580" y="90" width="340" height="32" rx="4" fill="#cfcfcf" opacity="0.6"/>
      <rect x="580" y="136" width="180" height="24" rx="4" fill="#e63946" opacity="0.2"/>
      <rect x="580" y="180" width="480" height="120" rx="6" fill="#e3e3e3" opacity="0.4"/>
    </g>
  </g>

  <!-- ======================================================================
       LEFT SIDE: FEATURE NARRATIVE & VALUE PROPOSITIONS (x: 80 to 480)
       ====================================================================== -->
  <g transform="translate(80, 84)">
    <!-- Eyebrow Pill -->
    <rect width="320" height="26" rx="13" fill="#1a1a1a"/>
    <circle cx="15" cy="13" r="3.5" fill="#e63946"/>
    <text x="26" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.06em">SCREENSHOT 1 : OVERVIEW &amp; STACK DETECTION</text>

    <!-- Headline -->
    <g transform="translate(0, 46)">
      <text x="0" y="28" class="font-sans" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="-0.8">Instant Core Web Vitals,</text>
      <text x="0" y="66" class="font-sans" font-size="32" font-weight="900" fill="#e63946" letter-spacing="-0.8">Stack &amp; Revenue Leaks</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 142)">
      <text x="0" y="16" class="font-sans" font-size="14" font-weight="500" fill="#5e5e5e">
        <tspan x="0" dy="0">Real-time client-side DOM audit with 0 queue delays.</tspan>
        <tspan x="0" dy="22">Pinpoint LCP, INP, CLS, and estimated lost revenue</tspan>
        <tspan x="0" dy="22">with automated technology stack signatures.</tspan>
      </text>
    </g>

    <!-- 3 Value Cards -->
    <g transform="translate(0, 230)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#e63946"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Real-Time Core Web Vitals</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Sub-second LCP, INP, and CLS scores measured live.</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(0, 76)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#2563eb"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">60+ Full-Stack Signatures</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Detects Shopify, Next.js, Klaviyo, Meta, and Cloudflare.</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(0, 152)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#10b981"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Financial Revenue Loss ROI</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Quantifies estimated monthly order leakage from latency.</text>
      </g>
    </g>
  </g>

  <!-- ======================================================================
       RIGHT SIDE: FLOATING POPUP MOCKUP (440px x 620px) at (740, 70)
       ====================================================================== -->
  <g transform="translate(740, 68)" filter="url(#popupShadow)">
    <!-- Popup Base Container -->
    <rect width="440" height="624" rx="10" fill="#f7f7f7" stroke="#e3e3e3" stroke-width="1.2"/>

    <!-- Header Bar -->
    <g transform="translate(18, 16)">
      <!-- Logo Icon -->
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#1a1a1a"/>
      <path d="M14 6 L22 14 L14 22 L6 14 Z" fill="none" stroke="#e63946" stroke-width="2"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff"/>

      <text x="36" y="20" class="font-sans" font-size="15" font-weight="900" fill="#1a1a1a">VitalsSniper</text>
      <rect x="134" y="4" width="34" height="18" rx="4" fill="#e63946"/>
      <text x="151" y="16.5" class="font-sans" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">PRO</text>

      <rect x="254" y="2" width="150" height="24" rx="5" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="264" y="17" class="font-mono" font-size="10" fill="#5e5e5e">apex-store-demo.com</text>
    </g>

    <!-- 4-Tab Segmented Bar -->
    <g transform="translate(18, 56)">
      <rect width="404" height="32" rx="6" fill="#efefef" stroke="#e3e3e3" stroke-width="1"/>
      <!-- Active Tab: Overview -->
