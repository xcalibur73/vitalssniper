<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <filter id="browserShadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1a1a1a" flood-opacity="0.14"/>
    </filter>

    <filter id="popupShadow3" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1a1a1a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>

    <pattern id="dotGrid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e3e3e3" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>

  <!-- Canvas Base -->
  <rect width="1280" height="800" fill="url(#bgGrad3)"/>
  <rect width="1280" height="800" fill="url(#dotGrid3)"/>

  <!-- Simulated Browser Window -->
  <g transform="translate(50, 36)" filter="url(#browserShadow3)">
    <rect width="1180" height="728" rx="10" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
    <rect width="1180" height="42" rx="10" fill="#1a1a1a"/>
    <rect y="32" width="1180" height="10" fill="#1a1a1a"/>

    <circle cx="22" cy="21" r="5" fill="#E63946"/>
    <circle cx="38" cy="21" r="5" fill="#E5A93C"/>
    <circle cx="54" cy="21" r="5" fill="#43A047"/>

    <rect x="90" y="8" width="560" height="26" rx="5" fill="#2d2d2d"/>
    <circle cx="104" cy="21" r="3.5" fill="#43A047"/>
    <text x="116" y="25" class="font-sans" font-size="11" fill="#e3e3e3">https://ergonova-desk.com/ergonomic-guides</text>

    <!-- Simulated Target Site Background -->
    <g transform="translate(0, 42)" opacity="0.45">
      <rect width="1180" height="56" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="80" y="36" class="font-sans" font-size="16" font-weight="900" fill="#1a1a1a">ERGONOVA RESEARCH</text>
      <rect y="56" width="1180" height="630" fill="#fafafa"/>
      <rect x="80" y="90" width="560" height="32" rx="4" fill="#cfcfcf" opacity="0.6"/>
      <rect x="80" y="140" width="620" height="200" rx="6" fill="#e3e3e3" opacity="0.4"/>
    </g>
  </g>

  <!-- LEFT SIDE: FEATURE NARRATIVE (x: 80 to 480) -->
  <g transform="translate(80, 84)">
    <!-- Eyebrow Pill -->
    <rect width="320" height="26" rx="13" fill="#1a1a1a"/>
    <circle cx="15" cy="13" r="3.5" fill="#e63946"/>
    <text x="26" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.06em">SCREENSHOT 3 : SEO HEADING &amp; LINK FORENSICS</text>

    <!-- Headline -->
    <g transform="translate(0, 46)">
      <text x="0" y="28" class="font-sans" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="-0.8">Visual H1-H6 Heading Tree</text>
      <text x="0" y="66" class="font-sans" font-size="32" font-weight="900" fill="#e63946" letter-spacing="-0.8">&amp; Link Graph Classifier</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 142)">
      <text x="0" y="16" class="font-sans" font-size="14" font-weight="500" fill="#5e5e5e">
        <tspan x="0" dy="0">Audit on-page heading structure and link topology.</tspan>
        <tspan x="0" dy="22">Detect missing primary H1 tags, skipped levels,</tspan>
        <tspan x="0" dy="22">internal vs external link equity, and canonical match.</tspan>
      </text>
    </g>

    <!-- 3 Value Cards -->
    <g transform="translate(0, 230)">
      <g transform="translate(0, 0)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#e63946"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">H1-H6 Heading Hierarchy Tree</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Inspects complete outline in DOM sequence with tag counts.</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#d97706"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Skipped Hierarchy Level Alerts</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Flags SEO and WCAG violations (e.g. H2 to H4 jump).</text>
      </g>

      <g transform="translate(0, 152)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#10b981"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Link Graph &amp; Canonical Match</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Classifies internal, external, nofollow, sponsored, and UGC.</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: POPUP MOCKUP (Tab 3: SEO Tree) -->
  <g transform="translate(740, 68)" filter="url(#popupShadow3)">
    <rect width="440" height="624" rx="10" fill="#f7f7f7" stroke="#e3e3e3" stroke-width="1.2"/>

    <!-- Header Bar -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#1a1a1a"/>
      <path d="M14 6 L22 14 L14 22 L6 14 Z" fill="none" stroke="#e63946" stroke-width="2"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff"/>
      <text x="36" y="20" class="font-sans" font-size="15" font-weight="900" fill="#1a1a1a">VitalsSniper</text>
      <rect x="134" y="4" width="34" height="18" rx="4" fill="#e63946"/>
      <text x="151" y="16.5" class="font-sans" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">PRO</text>
      <rect x="254" y="2" width="150" height="24" rx="5" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="264" y="17" class="font-mono" font-size="10" fill="#5e5e5e">ergonova-desk.com</text>
    </g>

    <!-- 4-Tab Segmented Bar -->
    <g transform="translate(18, 56)">
      <rect width="404" height="32" rx="6" fill="#efefef" stroke="#e3e3e3" stroke-width="1"/>
      <text x="51" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Overview</text>
      <text x="152" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Forensics</text>
      <!-- Active Tab: SEO Tree -->
      <rect x="204" y="2" width="98" height="28" rx="5" fill="#ffffff"/>
      <text x="253" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">SEO Tree</text>
      <text x="353" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Pitch</text>
    </g>

    <!-- Heading Hierarchy Overview Card -->
    <g transform="translate(18, 98)">
      <rect width="404" height="84" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="14" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a">Heading Tag Distribution (23 Headings)</text>

      <!-- Distribution Badges -->
      <g transform="translate(14, 28)">
        <rect x="0" y="0" width="56" height="22" rx="4" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="28" y="14.5" class="font-sans" font-size="9.5" font-weight="800" fill="#065f46" text-anchor="middle">H1: 1</text>

        <rect x="64" y="0" width="56" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="92" y="14.5" class="font-sans" font-size="9.5" font-weight="800" fill="#1e40af" text-anchor="middle">H2: 6</text>

        <rect x="128" y="0" width="56" height="22" rx="4" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="156" y="14.5" class="font-sans" font-size="9.5" font-weight="800" fill="#1e40af" text-anchor="middle">H3: 12</text>

        <rect x="192" y="0" width="56" height="22" rx="4" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
        <text x="220" y="14.5" class="font-sans" font-size="9.5" font-weight="800" fill="#4b5563" text-anchor="middle">H4: 4</text>
      </g>

      <!-- Alert Pill -->
      <g transform="translate(14, 56)">
        <rect width="376" height="20" rx="3" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
        <text x="8" y="14" class="font-sans" font-size="9" font-weight="700" fill="#b45309">WARNING: Skipped Level (H2 -> H4 jump at 'Technical Tolerances')</text>
      </g>
    </g>

    <!-- Visual Heading Tree Preview -->
    <g transform="translate(18, 192)">
      <rect width="404" height="154" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="14" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a">DOM Heading Sequence</text>

      <g transform="translate(14, 32)">
        <!-- H1 -->
        <g transform="translate(0, 0)">
          <rect width="28" height="18" rx="3" fill="#10b981"/>
          <text x="14" y="12.5" class="font-mono" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">H1</text>
          <text x="36" y="13" class="font-sans" font-size="10" font-weight="700" fill="#1a1a1a">Ergonomic Office Seating Standards for Engineers</text>
        </g>

        <!-- H2 (1) -->
        <g transform="translate(14, 24)">
          <rect width="28" height="18" rx="3" fill="#2563eb"/>
          <text x="14" y="12.5" class="font-mono" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">H2</text>
          <text x="36" y="13" class="font-sans" font-size="10" font-weight="600" fill="#1a1a1a">Biomechanical Posture and Pressure Distribution</text>
        </g>

        <!-- H3 (under H2) -->
        <g transform="translate(28, 48)">
          <rect width="28" height="18" rx="3" fill="#6b7280"/>
          <text x="14" y="12.5" class="font-mono" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">H3</text>
          <text x="36" y="13" class="font-sans" font-size="9.5" fill="#5e5e5e">Lumbar Spine Lordosis Angle Maintenance</text>
        </g>

        <!-- H2 (2) -->
        <g transform="translate(14, 72)">
          <rect width="28" height="18" rx="3" fill="#2563eb"/>
          <text x="14" y="12.5" class="font-mono" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">H2</text>
          <text x="36" y="13" class="font-sans" font-size="10" font-weight="600" fill="#1a1a1a">Technical Tolerances &amp; Material Stress</text>
        </g>

        <!-- H4 (Skipped) -->
        <g transform="translate(28, 96)">
          <rect width="28" height="18" rx="3" fill="#d97706"/>
          <text x="14" y="12.5" class="font-mono" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">H4</text>
          <text x="36" y="13" class="font-sans" font-size="9.5" font-weight="600" fill="#d97706">Piston Gas-Lift PSI Durability Limits (Skipped H3)</text>
        </g>
      </g>
    </g>

    <!-- Link Graph & Canonical Status Card -->
    <g transform="translate(18, 356)">
      <rect width="404" height="114" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="14" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a">Link Graph &amp; Canonical Match</text>

      <!-- Chips -->
      <g transform="translate(14, 30)">
        <rect x="0" y="0" width="86" height="22" rx="4" fill="#f3f4f6"/>
        <text x="43" y="14.5" class="font-sans" font-size="9" font-weight="700" fill="#374151" text-anchor="middle">142 Internal</text>

        <rect x="94" y="0" width="86" height="22" rx="4" fill="#f3f4f6"/>
        <text x="137" y="14.5" class="font-sans" font-size="9" font-weight="700" fill="#374151" text-anchor="middle">28 External</text>

        <rect x="188" y="0" width="86" height="22" rx="4" fill="#fef3c7"/>
        <text x="231" y="14.5" class="font-sans" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">14 Nofollow</text>

        <rect x="282" y="0" width="94" height="22" rx="4" fill="#eff6ff"/>
        <text x="329" y="14.5" class="font-sans" font-size="9" font-weight="700" fill="#1e40af" text-anchor="middle">4 Sponsored</text>
      </g>

      <!-- Canonical & Word Count Status -->
      <g transform="translate(14, 66)">
        <text x="0" y="14" class="font-sans" font-size="9.5" font-weight="700" fill="#1a1a1a">Canonical Match:</text>
        <rect x="100" y="2" width="78" height="18" rx="3" fill="#ecfdf5"/>
        <text x="139" y="14.5" class="font-sans" font-size="8.5" font-weight="800" fill="#065f46" text-anchor="middle">MATCH (CLEAN)</text>

        <text x="194" y="14" class="font-sans" font-size="9.5" font-weight="700" fill="#1a1a1a">Word Count:</text>
        <text x="264" y="14" class="font-mono" font-size="9.5" font-weight="700" fill="#1a1a1a">2,140 words</text>
      </g>
    </g>

    <!-- Action Button -->
    <g transform="translate(18, 480)">
      <rect width="404" height="42" rx="6" fill="#1a1a1a"/>
      <text x="202" y="26" class="font-sans" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Generate Client Outreach Pitch (Tab 4)</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(18, 592)">
      <text x="0" y="14" class="font-sans" font-size="10" font-weight="600" fill="#888888">v1.6.1 PRO : WebAudits.pro Quiet Paper Interface</text>
      <text x="404" y="14" class="font-sans" font-size="10" font-weight="700" fill="#e63946" text-anchor="end">webaudits.pro</text>
    </g>
  </g>
</svg>