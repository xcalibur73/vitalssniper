<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#F2EFE9"/>
    </linearGradient>

    <!-- Browser Dropshadow -->
    <filter id="browserShadow3" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#20201E" flood-opacity="0.14"/>
    </filter>

    <!-- Modal Elevation Shadow -->
    <filter id="modalShadow3" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#20201E" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#20201E" flood-opacity="0.12"/>
    </filter>

    <!-- PDF Dossier Shadow -->
    <filter id="pdfShadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#20201E" flood-opacity="0.18"/>
    </filter>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid3" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#DDD7CE" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>

  <!-- Outer Canvas Base -->
  <rect width="1280" height="800" fill="url(#bgGrad3)"/>
  <rect width="1280" height="800" fill="url(#dotGrid3)"/>

  <!-- ======================================================================
       SIMULATED BACKGROUND BROWSER (1180px x 720px) at (50, 36)
       ====================================================================== -->
  <g transform="translate(50, 36)" filter="url(#browserShadow3)">
    <rect width="1180" height="728" rx="10" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="1"/>
    
    <!-- Chrome Bar -->
    <rect width="1180" height="42" rx="10" fill="#20201E"/>
    <rect y="32" width="1180" height="10" fill="#20201E"/>

    <circle cx="22" cy="21" r="5" fill="#E63946"/>
    <circle cx="38" cy="21" r="5" fill="#E5A93C"/>
    <circle cx="54" cy="21" r="5" fill="#43A047"/>

    <rect x="90" y="8" width="560" height="26" rx="5" fill="#2D2C2A"/>
    <circle cx="104" cy="21" r="3.5" fill="#43A047"/>
    <text x="116" y="25" class="font-sans" font-size="11" fill="#DDD7CE">https://ecoliving-goods.com/collections/kitchen</text>

    <!-- Simulated Target Site Background (Dimmed) -->
    <g transform="translate(0, 42)" opacity="0.45">
      <rect width="1180" height="60" fill="#FAF8F3" stroke="#DDD7CE" stroke-width="0.8"/>
      <text x="40" y="38" class="font-sans" font-size="16" font-weight="900" fill="#20201E">ECOLIVING GOODS</text>
      <rect y="60" width="1180" height="300" fill="#F4EFEA"/>
      <text x="40" y="140" class="font-sans" font-size="32" font-weight="900" fill="#20201E">Sustainable Kitchenware</text>
    </g>
  </g>

  <!-- ======================================================================
       LEFT SIDE: FEATURE NARRATIVE & 1-PAGE PDF DOSSIER (x: 80 to 520)
       ====================================================================== -->
  <g transform="translate(80, 80)">
    <rect width="280" height="26" rx="13" fill="#20201E"/>
    <text x="140" y="17" class="font-sans" font-size="10.5" font-weight="800" fill="#B76345" text-anchor="middle" letter-spacing="0.06em">SCREENSHOT 3 : COMPETITOR VS</text>

    <!-- Headline -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" class="font-sans" font-size="30" font-weight="900" fill="#20201E" letter-spacing="-0.8">Head-to-Head Benchmarking &amp;</text>
      <text x="0" y="38" class="font-sans" font-size="30" font-weight="900" fill="#B76345" letter-spacing="-0.8">1-Page Client PDF Dossier</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 126)">
      <text x="0" y="0" class="font-sans" font-size="13.5" font-weight="500" fill="#666159" line-height="1.5">
        <tspan x="0" dy="0">Show clients why their rivals outrank them. Generate</tspan>
        <tspan x="0" dy="20">hard win/loss delta tables and white-label 1-page</tspan>
        <tspan x="0" dy="20">teardown PDFs branded with your agency logo.</tspan>
      </text>
    </g>

    <!-- 1-Page PDF Teardown Sheet Preview (Mini Dossier) -->
    <g transform="translate(0, 206)" filter="url(#pdfShadow3)">
      <!-- Sheet Frame (360px x 420px) -->
      <rect width="360" height="420" rx="6" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="1"/>
      
      <!-- Top Dossier Header Bar -->
      <rect width="360" height="46" rx="6" fill="#20201E"/>
      <rect y="40" width="360" height="6" fill="#20201E"/>
      <text x="16" y="28" class="font-sans" font-size="12" font-weight="800" fill="#F7F4EE">APEX WEB ARCHITECTURE</text>
      <rect x="234" y="14" width="110" height="18" rx="3" fill="#B76345"/>
      <text x="289" y="26" class="font-sans" font-size="8.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">CONFIDENTIAL AUDIT</text>

      <!-- Audit Target Meta -->
      <g transform="translate(16, 58)">
        <text x="0" y="14" class="font-sans" font-size="12" font-weight="700" fill="#20201E">Website Forensic Health Dossier</text>
        <text x="0" y="28" class="font-sans" font-size="9" fill="#666159">Target: ecoliving-goods.com   |   Rival: purehome.com</text>
      </g>

      <!-- Mini Scorecard -->
      <g transform="translate(16, 100)">
        <rect width="156" height="52" rx="4" fill="#FDF1F0" stroke="#F7BDB9" stroke-width="0.8"/>
        <text x="10" y="18" class="font-sans" font-size="8" font-weight="700" fill="#666159">PROSPECT SCORE</text>
        <text x="10" y="42" class="font-mono" font-size="20" font-weight="900" fill="#A8231B">38<tspan font-size="10" font-weight="600" fill="#666159">/100</tspan></text>

        <rect x="170" y="0" width="158" height="52" rx="4" fill="#EAF7EE" stroke="#BCE6C8" stroke-width="0.8"/>
        <text x="180" y="18" class="font-sans" font-size="8" font-weight="700" fill="#666159">RIVAL SCORE</text>
        <text x="180" y="42" class="font-mono" font-size="20" font-weight="900" fill="#1B6E38">84<tspan font-size="10" font-weight="600" fill="#666159">/100</tspan></text>
      </g>

      <!-- Mini Delta Overview -->
      <g transform="translate(16, 168)">
        <rect width="328" height="150" rx="4" fill="#FAF8F3" stroke="#DDD7CE" stroke-width="0.8"/>
        <text x="12" y="20" class="font-sans" font-size="9.5" font-weight="800" fill="#B76345">COMPETITIVE GAPS IDENTIFIED:</text>
        
        <text x="12" y="42" class="font-sans" font-size="9" font-weight="600" fill="#20201E">• DOM Tree: +3,700 excessive nodes vs rival (Elementor container nesting)</text>
        <text x="12" y="64" class="font-sans" font-size="9" font-weight="600" fill="#20201E">• Page Payload: +2.8 MB bloated asset transfer</text>
        <text x="12" y="86" class="font-sans" font-size="9" font-weight="600" fill="#20201E">• Viewport Zoom: User-scalable=no blocks WCAG 2.2 accessibility</text>
        <text x="12" y="108" class="font-sans" font-size="9" font-weight="600" fill="#20201E">• Structured Data: Missing Product &amp; AggregateRating schema graph</text>
        <text x="12" y="130" class="font-sans" font-size="9" font-weight="600" fill="#20201E">• TTFB Latency: 880ms vs rival 210ms (+670ms sluggish response)</text>
      </g>

      <!-- Signature & Booking Link -->
      <g transform="translate(16, 336)">
        <line x1="0" y1="0" x2="328" y2="0" stroke="#DDD7CE" stroke-width="0.8"/>
        <text x="0" y="18" class="font-sans" font-size="9" font-weight="700" fill="#20201E">Auditor: Alex Morgan, Lead Web Architect</text>
        <text x="0" y="32" class="font-sans" font-size="8.5" fill="#666159">Book 15-min strategy call: calendly.com/apex-audit/15min</text>
        <rect y="44" width="328" height="26" rx="4" fill="#20201E"/>
        <text x="164" y="61" class="font-sans" font-size="9.5" font-weight="700" fill="#F7F4EE" text-anchor="middle">Click to Schedule Free Diagnostic Walkthrough</text>
      </g>
    </g>
  </g>

  <!-- ======================================================================
       RIGHT SIDE: FLOATING COMPETITOR BENCHMARKING MODAL (x: 490, y: 64)
       ====================================================================== -->
  <g transform="translate(490, 64)" filter="url(#modalShadow3)">
    <!-- Modal Base Container (720px x 636px) -->
    <rect width="720" height="636" rx="12" fill="#FAF8F3" stroke="#DDD7CE" stroke-width="1.2"/>

    <!-- Modal Padding (Inner width: 680px) -->
    <g transform="translate(20, 18)">
      <!-- Modal Eyebrow -->
      <rect width="180" height="20" rx="10" fill="rgba(183,99,69,0.12)"/>
      <text x="90" y="14" class="font-sans" font-size="8.5" font-weight="800" fill="#B76345" text-anchor="middle" letter-spacing="0.06em">HEAD-TO-HEAD BENCHMARK</text>
      
      <!-- Modal Title -->
      <text x="0" y="42" class="font-sans" font-size="18" font-weight="800" fill="#20201E">Competitor Benchmarking</text>
      <text x="0" y="58" class="font-sans" font-size="11" fill="#666159">Compare structural speed and SEO metrics against direct industry rivals.</text>

      <!-- Similar Sites / Rival Quick Picker Bar (width: 680) -->
      <g transform="translate(0, 72)">
        <rect width="680" height="42" rx="6" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="1"/>
        <g transform="translate(14, 8)">
          <text x="0" y="11" class="font-sans" font-size="8" font-weight="800" fill="#666159" letter-spacing="0.05em">RIVAL SUGGESTIONS:</text>
          <g transform="translate(0, 16)">
            <!-- Chip 1 (Active) -->
            <rect x="0" y="0" width="120" height="20" rx="10" fill="#20201E"/>
            <text x="60" y="13" class="font-sans" font-size="9" font-weight="700" fill="#F7F4EE" text-anchor="middle">purehome.com</text>

            <!-- Chip 2 -->
            <rect x="130" y="0" width="130" height="20" rx="10" fill="#F7F4EE" stroke="#DDD7CE" stroke-width="1"/>
            <text x="195" y="13" class="font-sans" font-size="9" font-weight="600" fill="#20201E" text-anchor="middle">earthcookware.io</text>

            <!-- Chip 3 -->
            <rect x="270" y="0" width="116" height="20" rx="10" fill="#F7F4EE" stroke="#DDD7CE" stroke-width="1"/>
            <text x="328" y="13" class="font-sans" font-size="9" font-weight="600" fill="#20201E" text-anchor="middle">greenlife.shop</text>
          </g>
        </g>
      </g>

      <!-- Dual Battle Card Header (width: 680) -->
      <g transform="translate(0, 126)">
        <!-- Prospect Card -->
        <rect width="310" height="52" rx="6" fill="#FFFFFF" stroke="#F7BDB9" stroke-width="1.2"/>
        <text x="16" y="18" class="font-sans" font-size="8.5" font-weight="700" fill="#666159">PROSPECT</text>
        <text x="16" y="38" class="font-sans" font-size="13" font-weight="800" fill="#20201E">ecoliving-goods.com</text>

        <!-- VS Badge -->
        <circle cx="340" cy="26" r="15" fill="#B76345"/>
        <text x="340" y="30" class="font-sans" font-size="10" font-weight="800" fill="#FFFFFF" text-anchor="middle">VS</text>

        <!-- Competitor Card -->
        <rect x="370" y="0" width="310" height="52" rx="6" fill="#FFFFFF" stroke="#BCE6C8" stroke-width="1.2"/>
        <text x="386" y="18" class="font-sans" font-size="8.5" font-weight="700" fill="#666159">COMPETITOR</text>
        <text x="386" y="38" class="font-sans" font-size="13" font-weight="800" fill="#20201E">purehome.com</text>
      </g>

      <!-- Delta Comparison Table (width: 680) -->
      <g transform="translate(0, 190)">
        <rect width="680" height="210" rx="6" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="1"/>
        
        <!-- Table Header -->
        <rect width="680" height="28" rx="6" fill="#F4EFEA"/>
        <rect y="22" width="680" height="6" fill="#F4EFEA"/>
        <text x="16" y="18" class="font-sans" font-size="8.5" font-weight="800" fill="#666159">METRIC</text>
        <text x="200" y="18" class="font-sans" font-size="8.5" font-weight="800" fill="#666159">PROSPECT</text>
        <text x="360" y="18" class="font-sans" font-size="8.5" font-weight="800" fill="#666159">COMPETITOR</text>
        <text x="520" y="18" class="font-sans" font-size="8.5" font-weight="800" fill="#666159">DELTA / STATUS</text>

        <!-- Row 1: DOM Elements -->
        <g transform="translate(16, 34)">
          <text x="0" y="18" class="font-sans" font-size="11" font-weight="700" fill="#20201E">DOM Elements</text>
          <text x="184" y="18" class="font-mono" font-size="11.5" font-weight="700" fill="#A8231B">4,820</text>
          <text x="344" y="18" class="font-mono" font-size="11.5" font-weight="700" fill="#1B6E38">1,120</text>
          <rect x="504" y="5" width="96" height="18" rx="3" fill="#FDF1F0" stroke="#F7BDB9" stroke-width="0.8"/>
          <text x="552" y="17" class="font-sans" font-size="8.5" font-weight="800" fill="#A8231B" text-anchor="middle">+3,700 (LOSS)</text>
          <line x1="-16" y1="28" x2="664" y2="28" stroke="#E8E4DC" stroke-width="0.8"/>
        </g>

        <!-- Row 2: Payload -->
        <g transform="translate(16, 70)">
          <text x="0" y="18" class="font-sans" font-size="11" font-weight="700" fill="#20201E">Page Payload</text>
          <text x="184" y="18" class="font-mono" font-size="11.5" font-weight="700" fill="#A8231B">3.4 MB</text>
          <text x="344" y="18" class="font-mono" font-size="11.5" font-weight="700" fill="#1B6E38">620 KB</text>
          <rect x="504" y="5" width="96" height="18" rx="3" fill="#FDF1F0" stroke="#F7BDB9" stroke-width="0.8"/>
          <text x="552" y="17" class="font-sans" font-size="8.5" font-weight="800" fill="#A8231B" text-anchor="middle">+2.8 MB (LOSS)</text>
          <line x1="-16" y1="28" x2="664" y2="28" stroke="#E8E4DC" stroke-width="0.8"/>
        </g>

        <!-- Row 3: Mobile Scale -->
        <g transform="translate(16, 106)">
          <text x="0" y="18" class="font-sans" font-size="11" font-weight="700" fill="#20201E">Mobile Scaling</text>
          <text x="184" y="18" class="font-sans" font-size="11" font-weight="700" fill="#A8231B">Blocked</text>
          <text x="344" y="18" class="font-sans" font-size="11" font-weight="700" fill="#1B6E38">Unlocked</text>
          <rect x="504" y="5" width="96" height="18" rx="3" fill="#FDF1F0" stroke="#F7BDB9" stroke-width="0.8"/>
          <text x="552" y="17" class="font-sans" font-size="8.5" font-weight="800" fill="#A8231B" text-anchor="middle">FAIL (LOSS)</text>
          <line x1="-16" y1="28" x2="664" y2="28" stroke="#E8E4DC" stroke-width="0.8"/>
        </g>

        <!-- Row 4: Server TTFB -->
        <g transform="translate(16, 142)">
          <text x="0" y="18" class="font-sans" font-size="11" font-weight="700" fill="#20201E">Server TTFB</text>
          <text x="184" y="18" class="font-mono" font-size="11.5" font-weight="700" fill="#A8231B">880ms</text>
          <text x="344" y="18" class="font-mono" font-size="11.5" font-weight="700" fill="#1B6E38">210ms</text>
          <rect x="504" y="5" width="96" height="18" rx="3" fill="#FDF1F0" stroke="#F7BDB9" stroke-width="0.8"/>
          <text x="552" y="17" class="font-sans" font-size="8.5" font-weight="800" fill="#A8231B" text-anchor="middle">+670ms (LOSS)</text>
          <line x1="-16" y1="28" x2="664" y2="28" stroke="#E8E4DC" stroke-width="0.8"/>
        </g>

        <!-- Row 5: Page Builder -->
        <g transform="translate(16, 178)">
          <text x="0" y="16" class="font-sans" font-size="11" font-weight="700" fill="#20201E">Tech Stack</text>
          <text x="184" y="16" class="font-sans" font-size="11" font-weight="600" fill="#8A5308">Elementor</text>
          <text x="344" y="16" class="font-sans" font-size="11" font-weight="600" fill="#1B6E38">Custom Headless</text>
          <rect x="504" y="3" width="96" height="18" rx="3" fill="#FDF1F0" stroke="#F7BDB9" stroke-width="0.8"/>
          <text x="552" y="15" class="font-sans" font-size="8.5" font-weight="800" fill="#A8231B" text-anchor="middle">BLOATED</text>
        </g>
      </g>

      <!-- Competitive Outreach Hook Box (width: 680) -->
      <g transform="translate(0, 412)">
        <rect width="680" height="114" rx="6" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="1"/>
        <g transform="translate(16, 10)">
          <text x="0" y="12" class="font-sans" font-size="9" font-weight="800" fill="#B76345" letter-spacing="0.05em">COMPETITIVE OUTREACH HOOK</text>
          <rect x="560" y="0" width="88" height="20" rx="3" fill="#20201E"/>
          <text x="604" y="14" class="font-sans" font-size="9" font-weight="700" fill="#F7F4EE" text-anchor="middle">Copy Hook</text>

          <text x="0" y="36" class="font-mono" font-size="10.5" fill="#20201E" line-height="1.5">
            <tspan x="0" dy="0">"Your direct competitor purehome.com runs 1,120 DOM nodes with 210ms TTFB</tspan>
            <tspan x="0" dy="18">while ecoliving-goods.com carries 4,820 nodes and 3.4MB payload from Elementor bloat.</tspan>
            <tspan x="0" dy="18">We mapped the exact code-level fixes in this 1-page breakdown: mind if I share?"</tspan>
          </text>
        </g>
      </g>

      <!-- Action Row (width: 680) -->
      <g transform="translate(0, 536)">
        <rect width="520" height="38" rx="6" fill="#20201E"/>
        <text x="260" y="24" class="font-sans" font-size="12" font-weight="700" fill="#F7F4EE" text-anchor="middle">📥 Export 1-Page PDF Teardown Dossier</text>

        <rect x="536" y="0" width="144" height="38" rx="6" fill="#FFFFFF" stroke="#DDD7CE" stroke-width="1"/>
        <text x="608" y="24" class="font-sans" font-size="11.5" font-weight="700" fill="#20201E" text-anchor="middle">Close View</text>
      </g>
    </g>
  </g>
</svg>
