<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <filter id="browserShadow4" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1a1a1a" flood-opacity="0.14"/>
    </filter>

    <filter id="popupShadow4" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#1a1a1a" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.10"/>
    </filter>

    <pattern id="dotGrid4" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e3e3e3" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>

  <!-- Canvas Base -->
  <rect width="1280" height="800" fill="url(#bgGrad4)"/>
  <rect width="1280" height="800" fill="url(#dotGrid4)"/>

  <!-- Simulated Browser Window -->
  <g transform="translate(50, 36)" filter="url(#browserShadow4)">
    <rect width="1180" height="728" rx="10" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
    <rect width="1180" height="42" rx="10" fill="#1a1a1a"/>
    <rect y="32" width="1180" height="10" fill="#1a1a1a"/>

    <circle cx="22" cy="21" r="5" fill="#E63946"/>
    <circle cx="38" cy="21" r="5" fill="#E5A93C"/>
    <circle cx="54" cy="21" r="5" fill="#43A047"/>

    <rect x="90" y="8" width="560" height="26" rx="5" fill="#2d2d2d"/>
    <circle cx="104" cy="21" r="3.5" fill="#43A047"/>
    <text x="116" y="25" class="font-sans" font-size="11" fill="#e3e3e3">https://zenithapp.io/pricing</text>

    <!-- Simulated Target Site Background -->
    <g transform="translate(0, 42)" opacity="0.45">
      <rect width="1180" height="56" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="80" y="36" class="font-sans" font-size="16" font-weight="900" fill="#1a1a1a">ZENITH ANALYTICS</text>
      <rect y="56" width="1180" height="630" fill="#fafafa"/>
      <rect x="180" y="100" width="260" height="340" rx="8" fill="#e3e3e3" opacity="0.5"/>
      <rect x="480" y="80" width="280" height="380" rx="8" fill="#e63946" opacity="0.15"/>
      <rect x="800" y="100" width="260" height="340" rx="8" fill="#e3e3e3" opacity="0.5"/>
    </g>
  </g>

  <!-- LEFT SIDE: FEATURE NARRATIVE (x: 80 to 480) -->
  <g transform="translate(80, 84)">
    <!-- Eyebrow Pill -->
    <rect width="320" height="26" rx="13" fill="#1a1a1a"/>
    <circle cx="15" cy="13" r="3.5" fill="#e63946"/>
    <text x="26" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.06em">SCREENSHOT 4 : OUTREACH TEARDOWN ENGINE</text>

    <!-- Headline -->
    <g transform="translate(0, 46)">
      <text x="0" y="28" class="font-sans" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="-0.8">Transform Tech Flaws Into</text>
      <text x="0" y="66" class="font-sans" font-size="32" font-weight="900" fill="#e63946" letter-spacing="-0.8">High-Ticket Client Pitches</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 142)">
      <text x="0" y="16" class="font-sans" font-size="14" font-weight="500" fill="#5e5e5e">
        <tspan x="0" dy="0">Generate tailored, data-driven client outreach pitches</tspan>
        <tspan x="0" dy="22">citing real measured numbers: 0 vague claims.</tspan>
        <tspan x="0" dy="22">Export 1-page PDF briefs or copy directly to clipboard.</tspan>
      </text>
    </g>

    <!-- 3 Value Cards -->
    <g transform="translate(0, 230)">
      <g transform="translate(0, 0)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#e63946"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Evidence-First Pitch Copy</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Quotes exact measured metrics ($3,420/mo, 3.42s LCP).</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#2563eb"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">4 Tones &amp; 5 Distribution Channels</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Cold Email, Merchant, Agency, LinkedIn DM, and Loom.</text>
      </g>

      <g transform="translate(0, 152)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#10b981"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">1-Page PDF Teardown Brief</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Exports client-ready audit PDF dossier in 1 click.</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: POPUP MOCKUP (Tab 4: Pitch) -->
  <g transform="translate(740, 68)" filter="url(#popupShadow4)">
    <rect width="440" height="624" rx="10" fill="#f7f7f7" stroke="#e3e3e3" stroke-width="1.2"/>

    <!-- Header Bar -->
    <g transform="translate(18, 16)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#1a1a1a"/>
      <path d="M14 6 L22 14 L14 22 L6 14 Z" fill="none" stroke="#e63946" stroke-width="2"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff"/>
      <text x="36" y="20" class="font-sans" font-size="15" font-weight="900" fill="#1a1a1a">VitalsSniper</text>
      <rect x="134" y="4" width="34" height="18" rx="4" fill="#e63946"/>
      <text x="151" y="16.5" class="font-sans" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">PRO</text>
      <rect x="254" y="2" width="150" height="24" rx="5" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="264" y="17" class="font-mono" font-size="10" fill="#5e5e5e">zenithapp.io/pricing</text>
    </g>

    <!-- 4-Tab Segmented Bar -->
    <g transform="translate(18, 56)">
      <rect width="404" height="32" rx="6" fill="#efefef" stroke="#e3e3e3" stroke-width="1"/>
      <text x="51" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Overview</text>
      <text x="152" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">Forensics</text>
      <text x="252" y="20" class="font-sans" font-size="11" font-weight="600" fill="#666666" text-anchor="middle">SEO Tree</text>
      <!-- Active Tab: Pitch -->
      <rect x="304" y="2" width="98" height="28" rx="5" fill="#ffffff"/>
      <text x="353" y="20" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a" text-anchor="middle">Pitch</text>
    </g>

    <!-- Tone & Channel Selector Card -->
    <g transform="translate(18, 98)">
      <rect width="404" height="84" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="14" y="18" class="font-sans" font-size="10.5" font-weight="800" fill="#1a1a1a">Outreach Tone &amp; Format</text>

      <!-- Tone Pills -->
      <g transform="translate(14, 26)">
        <rect x="0" y="0" width="86" height="22" rx="4" fill="#1a1a1a"/>
        <text x="43" y="14.5" class="font-sans" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">Data-Driven</text>

        <rect x="92" y="0" width="70" height="22" rx="4" fill="#f3f4f6"/>
        <text x="127" y="14.5" class="font-sans" font-size="9" font-weight="600" fill="#4b5563" text-anchor="middle">Urgency</text>

        <rect x="168" y="0" width="70" height="22" rx="4" fill="#f3f4f6"/>
        <text x="203" y="14.5" class="font-sans" font-size="9" font-weight="600" fill="#4b5563" text-anchor="middle">Soft-Sell</text>

        <rect x="244" y="0" width="60" height="22" rx="4" fill="#f3f4f6"/>
        <text x="274" y="14.5" class="font-sans" font-size="9" font-weight="600" fill="#4b5563" text-anchor="middle">Direct</text>
      </g>

      <!-- Channel Selector -->
      <g transform="translate(14, 56)">
        <text x="0" y="14" class="font-sans" font-size="9.5" font-weight="700" fill="#5e5e5e">Channel:</text>
        <rect x="54" y="0" width="74" height="20" rx="3" fill="#e63946"/>
        <text x="91" y="13.5" class="font-sans" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle">Cold Email</text>

        <rect x="134" y="0" width="64" height="20" rx="3" fill="#f3f4f6"/>
        <text x="166" y="13.5" class="font-sans" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">Merchant</text>

        <rect x="204" y="0" width="56" height="20" rx="3" fill="#f3f4f6"/>
        <text x="232" y="13.5" class="font-sans" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">Agency</text>

        <rect x="266" y="0" width="50" height="20" rx="3" fill="#f3f4f6"/>
        <text x="291" y="13.5" class="font-sans" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">DM</text>

        <rect x="322" y="0" width="54" height="20" rx="3" fill="#f3f4f6"/>
        <text x="349" y="13.5" class="font-sans" font-size="8.5" font-weight="600" fill="#4b5563" text-anchor="middle">Loom</text>
      </g>
    </g>

    <!-- Pitch Script Preview Box -->
    <g transform="translate(18, 192)">
      <rect width="404" height="226" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <rect x="0" y="0" width="5" height="226" rx="2" fill="#2563eb"/>
      <text x="16" y="22" class="font-sans" font-size="11" font-weight="800" fill="#1a1a1a">Generated Proof-of-Flaw Pitch Script</text>

      <g transform="translate(16, 36)">
        <rect width="372" height="176" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="12" y="20" class="font-sans" font-size="10.5" font-weight="700" fill="#1a1a1a">Subject: zenithapp.io conversion drag (3.42s LCP)</text>
        <line x1="12" y1="28" x2="360" y2="28" stroke="#e5e7eb" stroke-width="1"/>

        <text x="12" y="46" class="font-sans" font-size="10" fill="#4b5563">
          <tspan x="12" dy="0">Hey [Name],</tspan>
          <tspan x="12" dy="18">Was testing zenithapp.io/pricing and noticed a 3.42s LCP</tspan>
          <tspan x="12" dy="18">driven by checkout.bundle.js (142ms main-thread delay).</tspan>
          <tspan x="12" dy="18">Based on your traffic, this is leaking an estimated</tspan>
          <tspan x="12" dy="18">$3,420/mo in lost signups due to mobile latency.</tspan>
          <tspan x="12" dy="18">I put together a 1-page technical fix roadmap. Want me</tspan>
          <tspan x="12" dy="18">to send the breakdown over?</tspan>
        </text>
      </g>
    </g>

    <!-- Action Bar: Copy Script & Export PDF -->
    <g transform="translate(18, 430)">
      <!-- Copy Button -->
      <rect width="404" height="42" rx="6" fill="#1a1a1a"/>
      <text x="202" y="26" class="font-sans" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Copy Script to Clipboard</text>

      <!-- Secondary Export Row -->
      <g transform="translate(0, 50)">
        <rect x="0" y="0" width="196" height="34" rx="6" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
        <text x="98" y="21" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Export 1-Page PDF Brief</text>

        <rect x="208" y="0" width="196" height="34" rx="6" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
        <text x="306" y="21" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Export RFC 4180 CSV</text>
      </g>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(18, 592)">
      <text x="0" y="14" class="font-sans" font-size="10" font-weight="600" fill="#888888">v1.6.1 PRO : WebAudits.pro Quiet Paper Interface</text>
      <text x="404" y="14" class="font-sans" font-size="10" font-weight="700" fill="#e63946" text-anchor="end">webaudits.pro</text>
    </g>
  </g>
</svg>