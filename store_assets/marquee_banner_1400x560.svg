          <text x="28" y="12.5" class="font-sans" font-size="8" font-weight="700" fill="#065f46" text-anchor="middle">Shopify</text>

          <rect x="62" y="0" width="56" height="18" rx="3" fill="#eff6ff"/>
          <text x="90" y="12.5" class="font-sans" font-size="8" font-weight="700" fill="#1e40af" text-anchor="middle">Next.js</text>

          <rect x="124" y="0" width="56" height="18" rx="3" fill="#eff6ff"/>
          <text x="152" y="12.5" class="font-sans" font-size="8" font-weight="700" fill="#1e40af" text-anchor="middle">Klaviyo</text>

          <rect x="186" y="0" width="64" height="18" rx="3" fill="#fff7ed"/>
          <text x="218" y="12.5" class="font-sans" font-size="8" font-weight="700" fill="#9a3412" text-anchor="middle">Cloudflare</text>
        </g>
