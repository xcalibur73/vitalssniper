        <rect width="250" height="44" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <circle cx="18" cy="22" r="5" fill="#e63946"/>
        <text x="32" y="21" class="font-sans" font-size="11.5" font-weight="800" fill="#1a1a1a">Revenue Loss Calculator</text>
        <text x="32" y="35" class="font-sans" font-size="9.5" fill="#5e5e5e">Quantifies order drag $/mo</text>
      </g>

      <!-- Badge 4: Outreach Pitch -->
      <g transform="translate(262, 54)">
        <rect width="250" height="44" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <circle cx="18" cy="22" r="5" fill="#d97706"/>
        <text x="32" y="21" class="font-sans" font-size="11.5" font-weight="800" fill="#1a1a1a">Client Pitch Teardowns</text>
        <text x="32" y="35" class="font-sans" font-size="9.5" fill="#5e5e5e">4 tones &amp; 5 outreach channels</text>
      </g>
    </g>

    <!-- Ecosystem Footnote -->
