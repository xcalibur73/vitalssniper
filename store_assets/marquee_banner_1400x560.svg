        <text x="52" y="13" class="font-sans" font-size="8.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">CHANNEL: COLD EMAIL</text>
      </g>

      <!-- Script Box -->
      <g transform="translate(18, 62)">
        <rect width="284" height="180" rx="6" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
        <text x="12" y="20" class="font-sans" font-size="10" font-weight="800" fill="#1a1a1a">Subject: apex-store.com conversion leak</text>
        <line x1="12" y1="28" x2="272" y2="28" stroke="#e5e7eb" stroke-width="1"/>
        
        <text x="12" y="46" class="font-sans" font-size="9" fill="#374151">
          <tspan x="12" dy="0">Hey [Name],</tspan>
          <tspan x="12" dy="16">Noticed apex-store.com is leaking an estimated</tspan>
          <tspan x="12" dy="16">$3,420/mo due to a 3.42s LCP on Shopify.</tspan>
          <tspan x="12" dy="16">Your checkout.bundle.js is blocking main-thread</tspan>
          <tspan x="12" dy="16">for 142ms, triggering mobile cart drop-offs.</tspan>
          <tspan x="12" dy="16">I mapped the 1-page fix roadmap. Free to review?</tspan>
        </text>
      </g>

      <!-- Action Buttons -->
