        <text x="142" y="24" class="font-sans" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">Copy Pitch to Clipboard</text>

        <rect y="46" width="138" height="32" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
        <text x="69" y="66" class="font-sans" font-size="9.5" font-weight="700" fill="#1f2937" text-anchor="middle">1-Page PDF Brief</text>

        <rect x="146" y="46" width="138" height="32" rx="5" fill="#f3f4f6" stroke="#e5e7eb" stroke-width="1"/>
        <text x="215" y="66" class="font-sans" font-size="9.5" font-weight="700" fill="#1f2937" text-anchor="middle">Export CSV Log</text>
