      <circle cx="20" cy="23" r="4" fill="#2563eb"/>
      <text x="32" y="27" class="font-sans" font-size="11" font-weight="800" fill="#FFFFFF">CLIENT TEARDOWN : TAB 4</text>
      
      <g transform="translate(200, 14)">
