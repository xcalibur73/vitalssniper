        <circle cx="36" cy="36" r="30" fill="none" stroke="#f59e0b" stroke-width="6" stroke-dasharray="188" stroke-dashoffset="45"/>
        <text x="36" y="42" class="font-sans" font-size="19" font-weight="900" fill="#1a1a1a" text-anchor="middle">78</text>
