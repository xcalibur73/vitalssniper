<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <linearGradient id="marqueeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="50%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <radialGradient id="terracottaGlow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="terracottaGlow2" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>

    <filter id="elevatedShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1a1a1a" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1a1a1a" flood-opacity="0.06"/>
    </filter>

    <pattern id="gridDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#e3e3e3" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>

  <!-- Background Base -->
  <rect width="1400" height="560" fill="url(#marqueeBg)"/>
  <rect width="1400" height="560" fill="url(#gridDots)"/>
  <rect width="1400" height="560" fill="url(#terracottaGlow1)"/>
  <rect width="1400" height="560" fill="url(#terracottaGlow2)"/>
  <rect x="0.5" y="0.5" width="1399" height="559" fill="none" stroke="#e3e3e3" stroke-width="1"/>

  <!-- LEFT COLUMN: Editorial Copy & Value Props (x: 80 to 660) -->
  <g transform="translate(80, 52)">
    <!-- Eyebrow Pill -->
    <g transform="translate(0, 0)">
      <rect width="245" height="26" rx="13" fill="#1a1a1a"/>
      <circle cx="13" cy="13" r="4" fill="#e63946"/>
      <text x="24" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.06em">CHROME EXTENSION : PRO EDITION</text>
    </g>

    <!-- Main Headline -->
    <g transform="translate(0, 48)">
      <text x="0" y="38" class="font-sans" font-size="42" font-weight="900" fill="#1a1a1a" letter-spacing="-1.2">Turn Technical Flaws</text>
      <text x="0" y="86" class="font-sans" font-size="42" font-weight="900" fill="#e63946" letter-spacing="-1.2">Into Client Retainers</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 162)">
      <text x="0" y="16" class="font-sans" font-size="16" font-weight="500" fill="#5e5e5e">
        <tspan x="0" dy="0">Instant in-browser Core Web Vitals, 60+ stack signatures,</tspan>
        <tspan x="0" dy="24">LoAF script attribution, on-page SEO tree, and revenue</tspan>
        <tspan x="0" dy="24">leakage calculator with ready-to-send outreach pitches.</tspan>
      </text>
    </g>

    <!-- 4 Pill Feature Badges -->
    <g transform="translate(0, 252)">
      <!-- Badge 1: CWV -->
      <g transform="translate(0, 0)">
        <rect width="250" height="44" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <circle cx="18" cy="22" r="5" fill="#10b981"/>
        <text x="32" y="21" class="font-sans" font-size="11.5" font-weight="800" fill="#1a1a1a">Live Core Web Vitals</text>
        <text x="32" y="35" class="font-sans" font-size="9.5" fill="#5e5e5e">LCP, INP &amp; CLS in active tab</text>
      </g>

      <!-- Badge 2: Stack -->
      <g transform="translate(262, 0)">
        <rect width="250" height="44" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <circle cx="18" cy="22" r="5" fill="#2563eb"/>
        <text x="32" y="21" class="font-sans" font-size="11.5" font-weight="800" fill="#1a1a1a">60+ Stack Signatures</text>
        <text x="32" y="35" class="font-sans" font-size="9.5" fill="#5e5e5e">Shopify, Next.js, Klaviyo, Meta</text>
