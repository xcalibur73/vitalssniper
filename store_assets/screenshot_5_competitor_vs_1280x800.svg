<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>

    <filter id="browserShadow5" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#1a1a1a" flood-opacity="0.14"/>
    </filter>

    <filter id="modalShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="36" flood-color="#1a1a1a" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1a1a1a" flood-opacity="0.12"/>
    </filter>

    <pattern id="dotGrid5" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#e3e3e3" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>

  <!-- Canvas Base -->
  <rect width="1280" height="800" fill="url(#bgGrad5)"/>
  <rect width="1280" height="800" fill="url(#dotGrid5)"/>

  <!-- Simulated Browser Window -->
  <g transform="translate(50, 36)" filter="url(#browserShadow5)">
    <rect width="1180" height="728" rx="10" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
    <rect width="1180" height="42" rx="10" fill="#1a1a1a"/>
    <rect y="32" width="1180" height="10" fill="#1a1a1a"/>

    <circle cx="22" cy="21" r="5" fill="#E63946"/>
    <circle cx="38" cy="21" r="5" fill="#E5A93C"/>
    <circle cx="54" cy="21" r="5" fill="#43A047"/>

    <rect x="90" y="8" width="560" height="26" rx="5" fill="#2d2d2d"/>
    <circle cx="104" cy="21" r="3.5" fill="#43A047"/>
    <text x="116" y="25" class="font-sans" font-size="11" fill="#e3e3e3">https://apex-store-demo.com/vs-competitor</text>

    <!-- Simulated Target Site Background -->
    <g transform="translate(0, 42)" opacity="0.35">
      <rect width="1180" height="56" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>
      <text x="80" y="36" class="font-sans" font-size="16" font-weight="900" fill="#1a1a1a">APEX DESIGN CO.</text>
      <rect y="56" width="1180" height="630" fill="#fafafa"/>
      <rect x="80" y="90" width="1020" height="460" rx="8" fill="#e3e3e3" opacity="0.4"/>
    </g>
  </g>

  <!-- LEFT SIDE: FEATURE NARRATIVE (x: 80 to 480) -->
  <g transform="translate(80, 84)">
    <!-- Eyebrow Pill -->
    <rect width="320" height="26" rx="13" fill="#1a1a1a"/>
    <circle cx="15" cy="13" r="3.5" fill="#e63946"/>
    <text x="26" y="17" class="font-sans" font-size="10.5" font-weight="700" fill="#ffffff" letter-spacing="0.06em">SCREENSHOT 5 : COMPETITOR BENCHMARK MATRIX</text>

    <!-- Headline -->
    <g transform="translate(0, 46)">
      <text x="0" y="28" class="font-sans" font-size="32" font-weight="900" fill="#1a1a1a" letter-spacing="-0.8">Side-by-Side Competitor</text>
      <text x="0" y="66" class="font-sans" font-size="32" font-weight="900" fill="#e63946" letter-spacing="-0.8">Benchmark Teardowns</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 142)">
      <text x="0" y="16" class="font-sans" font-size="14" font-weight="500" fill="#5e5e5e">
        <tspan x="0" dy="0">Benchmark your client against their top market rival.</tspan>
        <tspan x="0" dy="22">Reveal exact speed, DOM bloat, and revenue gaps</tspan>
        <tspan x="0" dy="22">to win agency proposals with undeniable empirical proof.</tspan>
      </text>
    </g>

    <!-- 3 Value Cards -->
    <g transform="translate(0, 230)">
      <g transform="translate(0, 0)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#e63946"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Head-to-Head CWV Delta</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Direct comparison of LCP, INP, and CLS thresholds.</text>
      </g>

      <g transform="translate(0, 76)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#2563eb"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">DOM &amp; Payload Weight Comparison</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Proves where competitor runs a leaner, faster stack.</text>
      </g>

      <g transform="translate(0, 152)">
        <rect width="360" height="64" rx="8" fill="#FFFFFF" stroke="#e3e3e3" stroke-width="1"/>
        <rect x="0" y="0" width="5" height="64" rx="2" fill="#10b981"/>
        <text x="16" y="23" class="font-sans" font-size="12" font-weight="800" fill="#1a1a1a">Win-Loss Proposal Dossier</text>
        <text x="16" y="43" class="font-sans" font-size="10.5" fill="#5e5e5e">Generates competitive sales hooks to close retainer deals.</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SIDE: COMPETITOR BENCHMARK MODAL (480px x 620px) at (720, 70) -->
  <g transform="translate(720, 68)" filter="url(#modalShadow)">
    <rect width="480" height="624" rx="10" fill="#ffffff" stroke="#e3e3e3" stroke-width="1.2"/>

    <!-- Modal Header -->
    <g transform="translate(20, 18)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#1a1a1a"/>
      <path d="M14 6 L22 14 L14 22 L6 14 Z" fill="none" stroke="#e63946" stroke-width="2"/>
      <circle cx="14" cy="14" r="2.5" fill="#ffffff"/>
      <text x="36" y="20" class="font-sans" font-size="15" font-weight="900" fill="#1a1a1a">Competitor Benchmark Matrix</text>
      <rect x="390" y="4" width="50" height="20" rx="4" fill="#e63946"/>
      <text x="415" y="17.5" class="font-sans" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">VS MODE</text>
    </g>

    <!-- Target vs Competitor Domains Bar -->
    <g transform="translate(20, 56)">
      <rect width="440" height="48" rx="6" fill="#f7f7f7" stroke="#e3e3e3" stroke-width="1"/>
      <g transform="translate(16, 12)">
        <text x="0" y="12" class="font-sans" font-size="9.5" font-weight="700" fill="#5e5e5e">CLIENT SITE</text>
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="800" fill="#e63946">apex-store-demo.com</text>
      </g>
      <text x="220" y="32" class="font-sans" font-size="14" font-weight="900" fill="#888888" text-anchor="middle">VS</text>
      <g transform="translate(260, 12)">
        <text x="0" y="12" class="font-sans" font-size="9.5" font-weight="700" fill="#5e5e5e">BENCHMARK RIVAL</text>
        <text x="0" y="26" class="font-mono" font-size="11" font-weight="800" fill="#10b981">hermanmiller.com</text>
      </g>
    </g>

    <!-- Side-by-Side Comparison Table -->
    <g transform="translate(20, 118)">
      <rect width="440" height="344" rx="8" fill="#ffffff" stroke="#e3e3e3" stroke-width="1"/>

      <!-- Table Header -->
      <rect width="440" height="32" fill="#f9fafb" rx="8"/>
      <rect y="24" width="440" height="8" fill="#f9fafb"/>
      <text x="16" y="21" class="font-sans" font-size="9.5" font-weight="800" fill="#6b7280">CORE METRIC</text>
      <text x="150" y="21" class="font-sans" font-size="9.5" font-weight="800" fill="#6b7280">CLIENT SITE</text>
      <text x="260" y="21" class="font-sans" font-size="9.5" font-weight="800" fill="#6b7280">COMPETITOR</text>
      <text x="360" y="21" class="font-sans" font-size="9.5" font-weight="800" fill="#6b7280">DELTA</text>

      <!-- Row 1: LCP -->
      <g transform="translate(16, 40)">
        <text x="0" y="22" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a">LCP (Largest Paint)</text>
        <text x="134" y="22" class="font-mono" font-size="12" font-weight="800" fill="#d97706">3.42s (Needs Work)</text>
        <text x="244" y="22" class="font-mono" font-size="12" font-weight="800" fill="#10b981">1.85s (Good)</text>
        <rect x="340" y="8" width="76" height="20" rx="3" fill="#fee2e2"/>
        <text x="378" y="21.5" class="font-sans" font-size="8.5" font-weight="800" fill="#991b1b" text-anchor="middle">+1.57s SLOWER</text>
        <line x1="0" y1="34" x2="408" y2="34" stroke="#f3f4f6" stroke-width="1"/>
      </g>

      <!-- Row 2: INP -->
      <g transform="translate(16, 80)">
        <text x="0" y="22" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a">INP (Interaction)</text>
        <text x="134" y="22" class="font-mono" font-size="12" font-weight="800" fill="#10b981">185ms (Good)</text>
        <text x="244" y="22" class="font-mono" font-size="12" font-weight="800" fill="#10b981">110ms (Good)</text>
        <rect x="340" y="8" width="76" height="20" rx="3" fill="#fef3c7"/>
        <text x="378" y="21.5" class="font-sans" font-size="8.5" font-weight="800" fill="#b45309" text-anchor="middle">+75ms DELAY</text>
        <line x1="0" y1="34" x2="408" y2="34" stroke="#f3f4f6" stroke-width="1"/>
      </g>

      <!-- Row 3: CLS -->
      <g transform="translate(16, 120)">
        <text x="0" y="22" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a">CLS (Layout Shift)</text>
        <text x="134" y="22" class="font-mono" font-size="12" font-weight="800" fill="#d97706">0.14 (Needs Work)</text>
        <text x="244" y="22" class="font-mono" font-size="12" font-weight="800" fill="#10b981">0.02 (Good)</text>
        <rect x="340" y="8" width="76" height="20" rx="3" fill="#fee2e2"/>
        <text x="378" y="21.5" class="font-sans" font-size="8.5" font-weight="800" fill="#991b1b" text-anchor="middle">7x MORE JANK</text>
        <line x1="0" y1="34" x2="408" y2="34" stroke="#f3f4f6" stroke-width="1"/>
      </g>

      <!-- Row 4: DOM Depth -->
      <g transform="translate(16, 160)">
        <text x="0" y="22" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a">DOM Tree Depth</text>
        <text x="134" y="22" class="font-mono" font-size="12" font-weight="800" fill="#d97706">24 Levels</text>
        <text x="244" y="22" class="font-mono" font-size="12" font-weight="800" fill="#10b981">12 Levels</text>
        <rect x="340" y="8" width="76" height="20" rx="3" fill="#fee2e2"/>
        <text x="378" y="21.5" class="font-sans" font-size="8.5" font-weight="800" fill="#991b1b" text-anchor="middle">2x DEEPER</text>
        <line x1="0" y1="34" x2="408" y2="34" stroke="#f3f4f6" stroke-width="1"/>
      </g>

      <!-- Row 5: Revenue Leak -->
      <g transform="translate(16, 200)">
        <text x="0" y="22" class="font-sans" font-size="11" font-weight="700" fill="#1a1a1a">Est. Monthly Leak</text>
        <text x="134" y="22" class="font-mono" font-size="12" font-weight="900" fill="#dc2626">-$3,420 / mo</text>
        <text x="244" y="22" class="font-mono" font-size="12" font-weight="800" fill="#10b981">$0 / mo (Optimal)</text>
        <rect x="340" y="8" width="76" height="20" rx="3" fill="#fee2e2"/>
        <text x="378" y="21.5" class="font-sans" font-size="8.5" font-weight="800" fill="#991b1b" text-anchor="middle">-$41K / YR GAP</text>
        <line x1="0" y1="34" x2="408" y2="34" stroke="#f3f4f6" stroke-width="1"/>
      </g>

      <!-- Key Proposal Takeaway -->
      <g transform="translate(16, 248)">
        <rect width="408" height="80" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="18" class="font-sans" font-size="10" font-weight="800" fill="#0f172a">AUTOMATED PROPOSAL HOOK</text>
        <text x="12" y="36" class="font-sans" font-size="9.5" fill="#334155">
          <tspan x="12" dy="0">"HermanMiller is loading +1.57s faster with 50% less DOM bloat,</tspan>
          <tspan x="12" dy="16">giving them a measurable conversion advantage. Modernizing your Shopify</tspan>
          <tspan x="12" dy="16">theme to match their 1.85s baseline reclaims an estimated $41k/yr."</tspan>
        </text>
      </g>
    </g>

    <!-- Action Bar -->
    <g transform="translate(20, 480)">
      <rect width="440" height="42" rx="6" fill="#1a1a1a"/>
      <text x="220" y="26" class="font-sans" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Export Head-to-Head Comparison PDF</text>
    </g>

    <!-- Footer Tag -->
    <g transform="translate(20, 592)">
      <text x="0" y="14" class="font-sans" font-size="10" font-weight="600" fill="#888888">v1.6.1 PRO : WebAudits.pro Quiet Paper Interface</text>
      <text x="440" y="14" class="font-sans" font-size="10" font-weight="700" fill="#e63946" text-anchor="end">webaudits.pro</text>
    </g>
  </g>
</svg>